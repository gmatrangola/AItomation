[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aitomations-backend"
version = "1.0.0"
description = "Home Assistant AI Automation Creator Backend"
requires-python = ">=3.9"
dependencies = [
    "flask>=2.3.0",
    "flask-cors>=2.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "google-generativeai>=0.3.0",
    "zeroconf>=0.132.0",
    "gunicorn>=21.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "ruff>=0.1.0", "black>=23.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "N",  # pep8-naming
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Allow unused imports in __init__.py

[tool.mypy]
python_version = "3.11"
mypy_path = "."
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
namespace_packages = false
explicit_package_bases = false
ignore_missing_imports = false

# Allow some flexibility for dynamic imports
[[tool.mypy.overrides]]
module = "app"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["google.generativeai", "google.*", "zeroconf", "flask_cors"]
ignore_missing_imports = true
