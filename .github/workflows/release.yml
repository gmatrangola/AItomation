name: Release Workflow

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  DOCKER_USERNAME: gmatrangola
  IMAGE_NAME: aitomations

jobs:
  prepare-release:
    name: Prepare Release Files
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Validate config.json has image field
        run: |
          if ! jq -e '.image' aitomations/config.json > /dev/null; then
            echo "❌ ERROR: config.json is missing the 'image' field"
            echo "The image field is required for releases so users pull from Docker Hub"
            echo ""
            echo "Expected format:"
            echo '  "image": "gmatrangola/aitomations-{arch}"'
            exit 1
          fi
          echo "✓ config.json has image field"

      - name: Validate version consistency
        run: |
          CONFIG_VERSION=$(jq -r '.version' aitomations/config.json)
          PACKAGE_VERSION=$(jq -r '.version' aitomations/src/frontend/package.json)
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"
          
          echo "Tag version:     $TAG_VERSION"
          echo "config.json:     $CONFIG_VERSION"
          echo "package.json:    $PACKAGE_VERSION"
          
          ERRORS=0
          
          if [ "$CONFIG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ ERROR: config.json version ($CONFIG_VERSION) does not match tag ($TAG_VERSION)"
            ERRORS=$((ERRORS + 1))
          fi
          
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ ERROR: package.json version ($PACKAGE_VERSION) does not match tag ($TAG_VERSION)"
            ERRORS=$((ERRORS + 1))
          fi
          
          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "Please update version numbers before tagging:"
            echo "  - aitomations/config.json"
            echo "  - aitomations/src/frontend/package.json"
            exit 1
          fi
          
          echo "✓ All version numbers match"

      - name: Validate changelog has entry
        run: |
          if ! grep -q "## \[${{ steps.version.outputs.VERSION }}\]" aitomations/Changelog.md; then
            echo "❌ ERROR: No changelog entry found for version ${{ steps.version.outputs.VERSION }}"
            echo ""
            echo "Please add a section in aitomations/Changelog.md with format:"
            echo "## [${{ steps.version.outputs.VERSION }}] - $(date +%Y-%m-%d)"
            echo ""
            echo "### Added"
            echo "- New feature 1"
            echo "- New feature 2"
            echo ""
            echo "### Changed"
            echo "- Changed behavior 1"
            echo ""
            echo "### Fixed"
            echo "- Bug fix 1"
            exit 1
          fi
          echo "✓ Changelog entry exists for version ${{ steps.version.outputs.VERSION }}"

      - name: Update README.md badge
        run: |
          sed -i "s/version-[0-9]\+\.[0-9]\+\.[0-9]\+-blue/version-${{ steps.version.outputs.VERSION }}-blue/g" README.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            aitomations/config.json
            README.md

  validate:
    name: Validate Code
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: make install

      - name: Validate code
        run: make validate

  build-release:
    name: Build Release Image
    needs: [prepare-release, validate]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, aarch64, armv7]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install pnpm and build frontend
        run: |
          npm install -g pnpm@10
          cd aitomations/src/frontend
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Map architecture
        id: arch
        run: |
          case "${{ matrix.arch }}" in
            amd64) echo "DOCKER_ARCH=linux/amd64" >> $GITHUB_OUTPUT; echo "BUILD_FROM=ghcr.io/home-assistant/amd64-base:latest" >> $GITHUB_OUTPUT ;;
            armv7) echo "DOCKER_ARCH=linux/arm/v7" >> $GITHUB_OUTPUT; echo "BUILD_FROM=ghcr.io/home-assistant/armv7-base:latest" >> $GITHUB_OUTPUT ;;
            aarch64) echo "DOCKER_ARCH=linux/arm64" >> $GITHUB_OUTPUT; echo "BUILD_FROM=ghcr.io/home-assistant/aarch64-base:latest" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build and push release
        uses: docker/build-push-action@v5
        with:
          context: ./aitomations
          file: ./aitomations/Dockerfile
          platforms: ${{ steps.arch.outputs.DOCKER_ARCH }}
          build-args: |
            BUILD_FROM=${{ steps.arch.outputs.BUILD_FROM }}
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}:${{ needs.prepare-release.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  update-install-repo:
    name: Update Install Repository
    needs: [prepare-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Checkout install repository
        uses: actions/checkout@v4
        with:
          repository: gmatrangola/aitomation-install
          token: ${{ secrets.INSTALL_REPO_TOKEN }}
          path: install

      - name: Sync files to install repository
        run: |
          cd source
          ./scripts/sync-install-repo.sh "$(pwd)" "../install" "${{ needs.prepare-release.outputs.version }}"

      - name: Commit and push changes
        run: |
          cd install
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add aitomations-creator/
          
          if ! git diff --staged --quiet; then
            git commit -m "Release version ${{ needs.prepare-release.outputs.version }}" \
                       -m "Auto-synced from source repository" \
                       -m "Source commit: ${{ github.sha }}" \
                       -m "Release tag: v${{ needs.prepare-release.outputs.version }}"
            git push origin main
          else
            echo "No changes to commit"
          fi

  create-github-release:
    name: Create GitHub Release
    needs: [prepare-release, update-install-repo]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract changelog for this version
        run: |
          if [ -f aitomations/Changelog.md ]; then
            awk -v version="${{ needs.prepare-release.outputs.version }}" \
                '/^## \['"$version"'\]/ { found=1; next } 
                 /^## \[/ { if (found) exit }
                 found { print }' \
                aitomations/Changelog.md > release_notes.md
          else
            echo "Release version ${{ needs.prepare-release.outputs.version }}" > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare-release.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}