name: CI Pipeline

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*.*.*'  # Releases are handled by release.yml
  pull_request:
    branches:
      - main

env:
  DOCKER_USERNAME: gmatrangola
  IMAGE_NAME: aitomations

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check config.json for development
        run: |
          HAS_IMAGE=$(jq -e '.image' aitomations/config.json > /dev/null && echo "yes" || echo "no")
          
          if [ "$HAS_IMAGE" = "yes" ]; then
            echo "⚠️  WARNING: config.json has 'image' field on development branch"
            echo "This will cause local builds to pull from Docker Hub instead of building locally"
            echo ""
            echo "For development, consider:"
            echo "  1. Remove the 'image' field from config.json"
            echo "  2. Or use a separate config.local.json"
            echo ""
            echo "The 'image' field will be validated on release tags"
          else
            echo "✓ config.json configured for local development (no image field)"
          fi

      - name: Check version consistency
        run: |
          CONFIG_VERSION=$(jq -r '.version' aitomations/config.json)
          PACKAGE_VERSION=$(jq -r '.version' aitomations/src/frontend/package.json)
          
          echo "config.json version:  $CONFIG_VERSION"
          echo "package.json version: $PACKAGE_VERSION"
          
          if [ "$CONFIG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "⚠️  WARNING: Version mismatch detected"
            echo "These should be the same for consistency"
          else
            echo "✓ Versions match"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: make install

      - name: Validate code
        run: make validate

  build-snapshot:
    name: Build Snapshot Image
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, aarch64, armv7]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install pnpm and build frontend
        run: |
          npm install -g pnpm@10
          cd aitomations/src/frontend
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Map architecture
        id: arch
        run: |
          case "${{ matrix.arch }}" in
            amd64) echo "DOCKER_ARCH=linux/amd64" >> $GITHUB_OUTPUT; echo "BUILD_FROM=ghcr.io/home-assistant/amd64-base:latest" >> $GITHUB_OUTPUT ;;
            armv7) echo "DOCKER_ARCH=linux/arm/v7" >> $GITHUB_OUTPUT; echo "BUILD_FROM=ghcr.io/home-assistant/armv7-base:latest" >> $GITHUB_OUTPUT ;;
            aarch64) echo "DOCKER_ARCH=linux/arm64" >> $GITHUB_OUTPUT; echo "BUILD_FROM=ghcr.io/home-assistant/aarch64-base:latest" >> $GITHUB_OUTPUT ;;
          esac

      - name: Get short SHA
        id: sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push snapshot
        uses: docker/build-push-action@v5
        with:
          context: ./aitomations
          file: ./aitomations/Dockerfile
          platforms: ${{ steps.arch.outputs.DOCKER_ARCH }}
          build-args: |
            BUILD_FROM=${{ steps.arch.outputs.BUILD_FROM }}
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}:dev
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}:dev-${{ steps.sha.outputs.SHORT_SHA }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}