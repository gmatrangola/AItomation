name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

env:
  DOCKER_USERNAME: gmatrangola
  IMAGE_NAME: aitomations

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: make install

      - name: Validate code
        run: make validate

  build-snapshot:
    name: Build Snapshot Image
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, armv7, aarch64, armhf, i386]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install pnpm and build frontend
        run: |
          npm install -g pnpm
          cd aitomations/src/frontend
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Map architecture
        id: arch
        run: |
          case "${{ matrix.arch }}" in
            amd64) echo "DOCKER_ARCH=linux/amd64" >> $GITHUB_OUTPUT; echo "BUILD_FROM=ghcr.io/home-assistant/amd64-base:latest" >> $GITHUB_OUTPUT ;;
            armv7) echo "DOCKER_ARCH=linux/arm/v7" >> $GITHUB_OUTPUT; echo "BUILD_FROM=ghcr.io/home-assistant/armv7-base:latest" >> $GITHUB_OUTPUT ;;
            aarch64) echo "DOCKER_ARCH=linux/arm64" >> $GITHUB_OUTPUT; echo "BUILD_FROM=ghcr.io/home-assistant/aarch64-base:latest" >> $GITHUB_OUTPUT ;;
            armhf) echo "DOCKER_ARCH=linux/arm/v6" >> $GITHUB_OUTPUT; echo "BUILD_FROM=ghcr.io/home-assistant/armhf-base:latest" >> $GITHUB_OUTPUT ;;
            i386) echo "DOCKER_ARCH=linux/386" >> $GITHUB_OUTPUT; echo "BUILD_FROM=ghcr.io/home-assistant/i386-base:latest" >> $GITHUB_OUTPUT ;;
          esac

      - name: Get short SHA
        id: sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push snapshot
        uses: docker/build-push-action@v5
        with:
          context: ./aitomations
          file: ./aitomations/Dockerfile
          platforms: ${{ steps.arch.outputs.DOCKER_ARCH }}
          build-args: |
            BUILD_FROM=${{ steps.arch.outputs.BUILD_FROM }}
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}:dev
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}:dev-${{ steps.sha.outputs.SHORT_SHA }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  build-release:
    name: Build Release Image
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, armv7, aarch64, armhf, i386]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install pnpm and build frontend
        run: |
          npm install -g pnpm
          cd aitomations/src/frontend
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Map architecture
        id: arch
        run: |
          case "${{ matrix.arch }}" in
            amd64) echo "DOCKER_ARCH=linux/amd64" >> $GITHUB_OUTPUT; echo "BUILD_FROM=ghcr.io/home-assistant/amd64-base:latest" >> $GITHUB_OUTPUT ;;
            armv7) echo "DOCKER_ARCH=linux/arm/v7" >> $GITHUB_OUTPUT; echo "BUILD_FROM=ghcr.io/home-assistant/armv7-base:latest" >> $GITHUB_OUTPUT ;;
            aarch64) echo "DOCKER_ARCH=linux/arm64" >> $GITHUB_OUTPUT; echo "BUILD_FROM=ghcr.io/home-assistant/aarch64-base:latest" >> $GITHUB_OUTPUT ;;
            armhf) echo "DOCKER_ARCH=linux/arm/v6" >> $GITHUB_OUTPUT; echo "BUILD_FROM=ghcr.io/home-assistant/armhf-base:latest" >> $GITHUB_OUTPUT ;;
            i386) echo "DOCKER_ARCH=linux/386" >> $GITHUB_OUTPUT; echo "BUILD_FROM=ghcr.io/home-assistant/i386-base:latest" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build and push release
        uses: docker/build-push-action@v5
        with:
          context: ./aitomations
          file: ./aitomations/Dockerfile
          platforms: ${{ steps.arch.outputs.DOCKER_ARCH }}
          build-args: |
            BUILD_FROM=${{ steps.arch.outputs.BUILD_FROM }}
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}-${{ matrix.arch }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  update-install-repo:
    name: Update Install Repository
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout install repository
        uses: actions/checkout@v4
        with:
          repository: glmatra/aitomation-install
          token: ${{ secrets.INSTALL_REPO_TOKEN }}
          path: install

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Sync files from source to install repo
        run: |
          # Create addon directory if it doesn't exist
          mkdir -p install/aitomations-creator
          
          # Copy config.json and update version
          cp source/aitomations/config.json install/aitomations-creator/config.json
          cd install/aitomations-creator
          jq --arg version "${{ steps.version.outputs.VERSION }}" \
             '.version = $version' \
             config.json > config.json.tmp
          mv config.json.tmp config.json
          cd ../..
          
          # Copy user-facing documentation from source
          cp source/docs/install/README.md install/aitomations-creator/README.md
          cp source/docs/install/DOCS.md install/aitomations-creator/DOCS.md
          
          # Generate CHANGELOG for install repo (user-facing only)
          cd source
          DATE=$(date +%Y-%m-%d)
          
          # Extract the latest version section from CHANGELOG
          awk -v version="${{ steps.version.outputs.VERSION }}" \
              '/^## \['"$version"'\]/ { found=1; print; next } 
               /^## \[/ { if (found) exit }
               found { print }' \
              CHANGELOG.md > ../install/aitomations-creator/new_entry.md
          
          cd ../install/aitomations-creator
          
          # Create or update CHANGELOG
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi
          
          # Prepend new entry if it exists
          if [ -s new_entry.md ]; then
            echo -e "# Changelog\n" > CHANGELOG.new.md
            cat new_entry.md >> CHANGELOG.new.md
            echo "" >> CHANGELOG.new.md
            tail -n +2 CHANGELOG.md >> CHANGELOG.new.md
            mv CHANGELOG.new.md CHANGELOG.md
          fi
          
          rm -f new_entry.md
          
          # Copy icons if they exist
          if [ -f ../../source/docs/install/icon.png ]; then
            cp ../../source/docs/install/icon.png icon.png
          fi
          if [ -f ../../source/docs/install/logo.png ]; then
            cp ../../source/docs/install/logo.png logo.png
          fi

      - name: Commit and push changes
        run: |
          cd install
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add aitomations-creator/
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Release version ${{ steps.version.outputs.VERSION }}

Auto-synced from source repository
Source commit: ${{ github.sha }}
Release tag: v${{ steps.version.outputs.VERSION }}"
            git push origin main
          fi

  create-github-release:
    name: Create GitHub Release
    needs: update-install-repo
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            awk -v version="${{ steps.version.outputs.VERSION }}" \
                '/^## \['"$version"'\]/ { found=1; next } 
                 /^## \[/ { if (found) exit }
                 found { print }' \
                CHANGELOG.md > release_notes.md
          else
            echo "Release version ${{ steps.version.outputs.VERSION }}" > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}